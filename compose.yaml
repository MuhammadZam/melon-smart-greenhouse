services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azolla_app
    restart: unless-stopped
    ports:
      - "${FORWARD_APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_monitoring_azolla}
      - DB_USERNAME=${DB_USERNAME:-azolla_user}
      - DB_PASSWORD=${DB_PASSWORD:-azolla_password}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - azolla_network

  mysql:
    image: mysql:8.0
    container_name: azolla_mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_monitoring_azolla}
      MYSQL_USER: ${DB_USERNAME:-azolla_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-azolla_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - azolla_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - azolla_network

volumes:
  azolla_mysql_data:
    driver: local

networks:
  azolla_network:
    driver: bridge
