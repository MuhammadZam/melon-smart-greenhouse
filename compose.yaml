x-app-runtime: &app-runtime
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    - .:/var/www/html
  environment:
    - DB_CONNECTION=mysql
    - DB_HOST=mysql
    - DB_PORT=3306
    - DB_DATABASE=${COMPRO_MYSQL_DATABASE:-db_monitoring_azolla}
    - DB_USERNAME=${DB_USERNAME:-azolla_user}
    - DB_PASSWORD=${DB_PASSWORD:-azolla_password}
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - azolla_network

services:
  app:
    <<: *app-runtime
    container_name: azolla_app
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "${FORWARD_APP_PORT:-8000}:8000"

  scheduler:
    <<: *app-runtime
    command: ["php", "artisan", "schedule:work"]

  mysql:
    image: mysql:8.0
    container_name: azolla_mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${COMPRO_MYSQL_DATABASE:-db_monitoring_azolla}
      MYSQL_USER: ${DB_USERNAME:-azolla_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-azolla_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - azolla_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - azolla_network

volumes:
  azolla_mysql_data:
    driver: local

networks:
  azolla_network:
    driver: bridge
